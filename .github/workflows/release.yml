# v로 시작하는 태그(예: v1.2.0)를 올리면 윈도우에서 exe를 만들어 GitHub Releases에 올립니다.
# 사용자 PC의 ClipKeeper가 이 릴리스를 보고 자동으로 업데이트해요.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pillow pystray pyinstaller

      - name: Check version matches tag
        shell: pwsh
        run: |
          $v = (python clipkeeper.py --version).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "clipkeeper.py의 APP_VERSION(v$v)과 태그(${{ github.ref_name }})가 달라요"
          }

      - name: Build exe
        run: |
          python clipkeeper.py --make-icon
          python -m PyInstaller --noconfirm --onefile --windowed --name ClipKeeper --icon clipkeeper.ico --hidden-import pystray._win32 clipkeeper.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipKeeper.exe
          generate_release_notes: true
